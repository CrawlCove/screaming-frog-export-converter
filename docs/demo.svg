<text x="490" y="23" fill="#8A93A6" text-anchor="middle" style="font-size:13px">screaming-frog-export-converter</text>
<g class="ln l0"><text x="22" y="83" fill="#22D3EE">$</text><g clip-path="url(#p0)"><text x="39" y="83" fill="#F2F5FA">npx github:CrawlCove/screaming-frog-export-converter internal_all.csv -o crawl.json</text></g></g>
<text class="ln l1" x="22" y="103" fill="#C7CEDB">8 row(s) read, 7 page(s) written, 1 skipped → crawl.json</text>
<text class="ln l2" x="22" y="123" fill="#FFB020">mapped: url←Address, finalUrl←Redirect URL, statusCode←Status Code, contentType←Content Type, depth←Crawl</text>
<text class="ln l3" x="22" y="143" fill="#FFB020">  Depth, indexable←Indexability, title←Title 1, titleLength←Title 1 Length, metaDescription←Meta Description</text>
<text class="ln l4" x="22" y="163" fill="#FFB020">  1, metaLength←Meta Description 1 Length, canonical←Canonical Link Element 1, htmlLang←Language,</text>
<text class="ln l5" x="22" y="183" fill="#FFB020">  robotsMeta←Meta Robots 1, xRobotsTag←X-Robots-Tag 1, wordCount←Word Count, linksInternal←Unique Outlinks,</text>
<text class="ln l6" x="22" y="203" fill="#FFB020">  linksExternal←Unique External Outlinks, responseTimeMs←Response Time, byteSize←Size (bytes), h1Count←H1-1 +</text>
<text class="ln l7" x="22" y="223" fill="#FFB020">  H1-2</text>
<text class="ln l8" x="22" y="243" fill="#C7CEDB">not in this export: imageCount, imagesMissingAlt, rendered, schemaBlocks, hreflangCount, contentFingerprint,</text>
<text class="ln l9" x="22" y="263" fill="#C7CEDB">  findingsCount</text>
<text class="ln l10" x="22" y="283" fill="#C7CEDB">note: Hash ignored: Screaming Frog hashes the whole response (MD5); Crawl Cove fingerprints visible content</text>
<text class="ln l11" x="22" y="303" fill="#C7CEDB">  (64-bit). Not comparable, left empty.</text>
<text class="ln l12" x="22" y="323" fill="#C7CEDB">note: h1Count is counted from the 2 H1 column(s) the Frog exports, so it is capped at 2.</text>
<text class="ln l13" x="22" y="343" fill="#FFB020">note: redirectHops is 1 when Redirect URI is set, else 0: the Internal export records one hop. Use the Frog's</text>
<text class="ln l14" x="22" y="363" fill="#FFB020">  Redirect Chains report for full chains.</text>
<text class="ln l15" x="22" y="383" fill="#C7CEDB">note: linksInternal reads Unique Outlinks; the Frog counts internal outlinks there and external ones</text>
<text class="ln l16" x="22" y="403" fill="#C7CEDB">  separately.</text>
<text class="ln l17" x="22" y="423" fill="#C7CEDB">note: Always empty/default (no Internal-tab source): imageCount, imagesMissingAlt (Images tab), schemaBlocks</text>
<text class="ln l18" x="22" y="443" fill="#C7CEDB">  (Structured Data tab), hreflangCount (Hreflang tab), rendered (per-crawl setting), findingsCount (Crawl Cove</text>
<text class="ln l19" x="22" y="463" fill="#C7CEDB">  checks have not run).</text>
<text class="ln l20" x="22" y="483" fill="#C7CEDB">skipped line 9: non-http address &quot;mailto:hello@acmebakery.example&quot;</text>
<g class="ln l21"><text x="22" y="503" fill="#22D3EE">$</text><g clip-path="url(#p21)"><text x="39" y="503" fill="#F2F5FA">jq -r '.pages[] | &quot;\(.statusCode) \(.url)&quot;' crawl.json</text></g></g>
<text class="ln l22" x="22" y="523" fill="#34F5C5">200 https://acmebakery.example/</text>
